<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottle</title>

<style>
  body { margin: 0; background: #ffffff; color: #16191A;
         font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; }

  /* The 3D canvas sits behind the text and never intercepts clicks */
  #scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* Text column on the left. The tall bottom padding is what creates
     the scroll distance the bottle animates across. */
  #text { position: relative; z-index: 1; max-width: 520px;
          padding: 16vh 8vw 220vh; }
  #text h1 { font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.05; margin: 0 0 24px; }
  #text p  { font-size: 1.05rem; line-height: 1.65; max-width: 42ch; margin: 0 0 18px; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="scene"></div>

<div id="text">
  <h1>My 3D bottle</h1>
  <p>Write whatever you want here.</p>
  <p>Scroll down and the bottle drifts across to the left.</p>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';


/* ============================================================
   TWEAK ZONE
   ============================================================ */

const FOV      = 35;    // 20 = telephoto, 70 = wide
const SIZE     = 2.4;   // how big the bottle sits on screen
const EXPOSURE = 1.05;  // 0.6 dark, 1.6 bright

const FACING   = 0;     // turn the bottle so the label faces you (radians)
const HEIGHT   = 0;     // raise or lower the bottle

// Where the bottle sits across the screen, as a fraction of the visible
// half-width. 1 = hard against the edge, 0 = dead centre.
const START_X  = 0.55;  // top of the page: right side
const END_X    = -0.45; // bottom of the page: left side

const SCROLL_EASE = 0.08;  // 0.02 floaty, 0.3 snappy


/* ============================================================
   THE 3D WORLD
   ============================================================ */

const scene = new THREE.Scene();
// No scene.background, so the white page shows through the canvas.

const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXPOSURE;
document.getElementById('scene').appendChild(renderer.domElement);

// Studio environment for reflections and base fill
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Key light from one side so the silhouette reads against white
const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);

// The rig carries the bottle. Scroll moves the rig, never the model,
// so the centring offset and the movement stay in separate objects.
const rig = new THREE.Group();
rig.rotation.y = FACING;
rig.position.y = HEIGHT;
scene.add(rig);


/* ============================================================
   LOAD THE MODEL - model.glb goes next to this file
   ============================================================ */

let loaded     = false;
let modelHalfW = 0;   // half the bottle's width, used to keep it in frame
let leftX = 0, rightX = 0;

new GLTFLoader().load('model.glb', (gltf) => {
  const model = gltf.scene;

  // Scale first, then offset by the scaled centre
  const box    = new THREE.Box3().setFromObject(model);
  const length = box.getSize(new THREE.Vector3()).length();
  const centre = box.getCenter(new THREE.Vector3());
  const s      = SIZE / length;

  model.scale.setScalar(s);
  model.position.copy(centre).multiplyScalar(-s);

  modelHalfW = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).x / 2;

  rig.add(model);
  loaded = true;
  layout();
}, undefined, (err) => console.error('model.glb failed to load:', err));


/* ============================================================
   LAYOUT - works out how far the bottle can travel without
   any part of it leaving the screen. Reruns on resize.
   ============================================================ */

function layout() {
  const halfH = Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * camera.position.length();
  const halfW = halfH * camera.aspect;

  // Furthest the centre can sit before an edge clips
  const maxShift = Math.max(0, halfW - modelHalfW - 0.15);

  rightX = Math.min(halfW * START_X, maxShift);
  leftX  = Math.max(halfW * END_X, -maxShift);
}


/* ============================================================
   SCROLL
   ============================================================ */

let progress = 0;   // 0 at the top of the page, 1 at the bottom
let smoothed = 0;

function readScroll() {
  const max = document.body.scrollHeight - innerHeight;
  progress = max > 0 ? Math.min(scrollY / max, 1) : 0;
}
addEventListener('scroll', readScroll, { passive: true });
readScroll();

const lerp = (a, b, t) => a + (b - a) * t;


/* ============================================================
   ANIMATION LOOP
   ============================================================ */

function animate() {
  requestAnimationFrame(animate);

  smoothed = lerp(smoothed, progress, SCROLL_EASE);

  if (loaded) {
    rig.position.x = lerp(rightX, leftX, smoothed);
  }

  renderer.render(scene, camera);
}
animate();


addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  layout();
});
</script>

</body>
</html>
